<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Baixar o Sello</title>
  <meta name="robots" content="noindex,nofollow" />
  <meta name="theme-color" content="#E30F2F" />
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <style>
    :root { --red:#E30F2F; --cream:#F8F2EC; --ink:#0D111B; }
    * { box-sizing:border-box; margin:0; }
    html,body { height:100%; }
    body {
      background:var(--red); color:#fff; min-height:100%;
      display:flex; align-items:center; justify-content:center;
      font-family:'Open Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
      padding:24px; text-align:center;
    }
    .wrap { max-width:360px; width:100%; }
    .mark { width:96px; height:96px; margin:0 auto 20px; display:block; }
    h1 { font-size:22px; font-weight:700; margin-bottom:8px; line-height:1.25; }
    p { font-size:15px; opacity:.9; line-height:1.5; margin-bottom:28px; }
    .stores { display:flex; flex-direction:column; gap:12px; }
    .store {
      display:flex; align-items:center; justify-content:center; gap:10px;
      background:#fff; color:var(--ink); text-decoration:none;
      border-radius:14px; padding:14px 18px; font-weight:700; font-size:15px;
    }
    .store svg { width:22px; height:22px; }
    .hint { margin-top:20px; font-size:13px; opacity:.75; }
    a.home { color:#fff; }
  </style>
</head>
<body>
  <div class="wrap">
    <img class="mark" src="assets/img/seal.svg" alt="Sello" onerror="this.style.display='none'" />
    <h1 id="headline">Redirecionando você para a loja…</h1>
    <p id="sub">Se nada acontecer em alguns segundos, escolha sua loja abaixo.</p>
    <div class="stores">
      <a class="store" id="ios" href="https://apps.apple.com/br/app/sello/id6791353216">
        <svg viewBox="0 0 384 512" fill="currentColor" aria-hidden="true"><path d="M318.7 268.7c-.2-36.7 16.4-64.4 50-84.8-18.8-26.9-47.2-41.7-84.7-44.6-35.5-2.8-74.3 20.7-88.5 20.7-15 0-49.4-19.7-76.4-19.7C63.3 141.2 4 184.8 4 273.5q0 39.3 14.4 81.2c12.8 36.7 59 126.7 107.2 125.2 25.2-.6 43-17.9 75.8-17.9 31.8 0 48.3 17.9 76.4 17.9 48.6-.7 90.4-82.5 102.6-119.3-65.2-30.7-61.7-90-61.7-91.9zm-56.6-164.2c27.3-32.4 24.8-61.9 24-72.5-24.1 1.4-52 16.4-67.9 34.9-17.5 19.8-27.8 44.3-25.6 71.9 26.1 2 49.9-11.4 69.5-34.3z"/></svg>
        Baixar na App Store
      </a>
      <a class="store" id="android" href="https://play.google.com/store/apps/details?id=com.sello.app">
        <svg viewBox="0 0 512 512" fill="currentColor" aria-hidden="true"><path d="M325.3 234.3 104.6 13l280.8 161.2-60.1 60.1zM47 0C34 6.8 25.3 19.2 25.3 35.3v441.3c0 16.1 8.7 28.5 21.7 35.3l256.6-256L47 0zm425.2 225.6-58.9-34.1-65.7 64.5 65.7 64.5 60.1-34.1c18-14.3 18-46.5-1.2-60.8zM104.6 499l280.8-161.2-60.1-60.1L104.6 499z"/></svg>
        Disponível no Google Play
      </a>
    </div>
    <p class="hint"><a class="home" href="/">Voltar ao site do Sello</a></p>
  </div>

  <script>
    (function () {
      var ua = navigator.userAgent || navigator.vendor || '';
      var isIOS = /iPad|iPhone|iPod/.test(ua) ||
        // iPadOS 13+ reports as Mac; disambiguate by touch support.
        (/Macintosh/.test(ua) && 'ontouchend' in document);
      var isAndroid = /android/i.test(ua);
      var IOS_URL = document.getElementById('ios').href;
      var ANDROID_URL = document.getElementById('android').href;
      if (isIOS) {
        location.replace(IOS_URL);
      } else if (isAndroid) {
        location.replace(ANDROID_URL);
      } else {
        // Desktop / unknown — no auto-redirect; show both buttons and a QR-free
        // fallback. Update the copy so it doesn't claim a redirect that won't come.
        document.getElementById('headline').textContent = 'Baixe o Sello';
        document.getElementById('sub').textContent = 'Escolha a sua loja para instalar o app.';
      }
    })();
  </script>
</body>
</html>
