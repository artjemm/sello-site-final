<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Baixar o Sello</title>
  <meta name="robots" content="noindex,nofollow" />
  <meta name="theme-color" content="#FFFFFF" />
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet" />
  <style>
    :root { --red:#E30F2F; --ink:#0D111B; --btn:#F2F2F2; }
    * { box-sizing:border-box; margin:0; }
    html,body { height:100%; }
    body {
      background:#fff; color:var(--ink); min-height:100%;
      display:flex; align-items:center; justify-content:center;
      font-family:'Open Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
      padding:32px 24px; text-align:center;
    }
    .wrap { width:100%; max-width:400px; }
    .logo { display:flex; align-items:center; justify-content:center; margin-bottom:56px; }
    /* Máscara: usa a forma do SVG como stencil e preenche de vermelho — assim o
       logo fica vermelho mesmo o arquivo não tendo fill vermelho. */
    .logo .word {
      display:block; width:190px; height:52px;
      background-color:var(--red);
      -webkit-mask:url(assets/img/wordmark.svg) no-repeat center / contain;
      mask:url(assets/img/wordmark.svg) no-repeat center / contain;
    }
    h1 {
      font-family:'Anton',sans-serif; font-weight:400; text-transform:uppercase;
      font-size:38px; line-height:1.05; letter-spacing:.5px; color:var(--ink);
      margin-bottom:44px;
    }
    h1 .accent { color:var(--red); }
    .stores { display:flex; flex-direction:column; gap:12px; }
    .store {
      display:flex; align-items:center; justify-content:center; gap:12px;
      background:var(--btn); color:var(--ink); text-decoration:none;
      border-radius:14px; height:60px; padding:0 20px;
      font-weight:700; font-size:16px;
      transition:background .15s ease;
    }
    .store:active { background:#E7E7E7; }
    .store svg { width:22px; height:22px; flex:0 0 auto; }
    #dica {
      margin-top:20px; font-size:14px; line-height:1.5; color:#5B5B5B;
    }
    #dica strong { color:var(--ink); }
    .know { display:inline-block; margin-top:36px; color:var(--red); font-weight:700; font-size:16px; text-decoration:underline; text-underline-offset:3px; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="logo">
      <span class="word" role="img" aria-label="Sello"></span>
    </div>

    <h1>Viva a cidade através da <span class="accent">Gastronomia!</span></h1>

    <div class="stores">
      <a class="store" id="ios" href="https://apps.apple.com/br/app/sello/id6791353216">
        <svg viewBox="0 0 384 512" fill="currentColor" aria-hidden="true"><path d="M318.7 268.7c-.2-36.7 16.4-64.4 50-84.8-18.8-26.9-47.2-41.7-84.7-44.6-35.5-2.8-74.3 20.7-88.5 20.7-15 0-49.4-19.7-76.4-19.7C63.3 141.2 4 184.8 4 273.5q0 39.3 14.4 81.2c12.8 36.7 59 126.7 107.2 125.2 25.2-.6 43-17.9 75.8-17.9 31.8 0 48.3 17.9 76.4 17.9 48.6-.7 90.4-82.5 102.6-119.3-65.2-30.7-61.7-90-61.7-91.9zm-56.6-164.2c27.3-32.4 24.8-61.9 24-72.5-24.1 1.4-52 16.4-67.9 34.9-17.5 19.8-27.8 44.3-25.6 71.9 26.1 2 49.9-11.4 69.5-34.3z"/></svg>
        Baixar na App Store
      </a>
      <a class="store" id="android" href="https://play.google.com/store/apps/details?id=com.sello.app">
        <svg viewBox="0 0 512 512" fill="currentColor" aria-hidden="true"><path d="M325.3 234.3 104.6 13l280.8 161.2-60.1 60.1zM47 0C34 6.8 25.3 19.2 25.3 35.3v441.3c0 16.1 8.7 28.5 21.7 35.3l256.6-256L47 0zm425.2 225.6-58.9-34.1-65.7 64.5 65.7 64.5 60.1-34.1c18-14.3 18-46.5-1.2-60.8zM104.6 499l280.8-161.2-60.1-60.1L104.6 499z"/></svg>
        Baixar no Google Play
      </a>
    </div>

    <p id="dica" hidden>
      Não abriu? Toque em <strong>&#8943;</strong> no canto e escolha
      <strong>Abrir no navegador</strong>.
    </p>

    <a class="know" href="/">Conhecer o Sello</a>
  </div>

  <script>
    (function () {
      var ua = navigator.userAgent || navigator.vendor || '';
      var isIOS = /iPad|iPhone|iPod/.test(ua) ||
        (/Macintosh/.test(ua) && 'ontouchend' in document);
      var isAndroid = /android/i.test(ua);
      // Instagram, Facebook, TikTok e LinkedIn abrem links num navegador
      // próprio, embutido — é lá que a App Store não abre.
      var embutido = /Instagram|FBAN|FBAV|musical_ly|Bytedance|TikTok|LinkedInApp/i.test(ua);
      var stores = document.querySelector('.stores');
      var ios = document.getElementById('ios');
      var android = document.getElementById('android');
      var dica = document.getElementById('dica');

      if (isAndroid && stores) stores.insertBefore(android, stores.firstChild);
      else if (isIOS && stores) stores.insertBefore(ios, stores.firstChild);

      /* ── Por que este bloco existe ────────────────────────────────────────
       *
       * O botão da App Store não abre quando o link chega por Instagram ou
       * TikTok. O do Google Play abre — e essa diferença é a pista: o navegador
       * embutido NAVEGA bem (o Google Play é uma página web comum), mas recusa
       * ENTREGAR o link ao aplicativo da App Store, que é o que o iOS tenta
       * fazer com apps.apple.com.
       *
       * Duas tentativas já falharam, e cada uma ensinou algo:
       *   1. itms-apps:// por código  → navegação por código para esquema
       *      nativo é bloqueada nesses navegadores.
       *   2. itms-apps:// no href     → o toque passou a ser a navegação, e
       *      ainda assim não abriu: o esquema em si é recusado.
       *
       * Terceira abordagem, em camadas, da mais transparente à mais explícita:
       *
       *   a) x-safari-https:// — pede ao iOS para abrir a URL no Safari, fora
       *      da moldura do app. É o caminho que costuma vencer esse bloqueio.
       *   b) o https de sempre, 1,2s depois, se ainda estivermos aqui.
       *   c) se 2,5s depois a página CONTINUAR visível, nada abriu: aí
       *      mostramos a instrução de abrir no navegador. Preferimos dizer à
       *      pessoa o que fazer a deixá-la tocando num botão morto.
       *
       * Fora dos navegadores embutidos nada disso roda: no Safari o link
       * sempre funcionou.
       */
      if (isIOS && embutido && ios) {
        var web = ios.getAttribute('href');
        ios.setAttribute('href', 'x-safari-' + web);
        ios.addEventListener('click', function () {
          setTimeout(function () {
            if (!document.hidden) window.location.href = web;
          }, 1200);
          setTimeout(function () {
            if (!document.hidden && dica) dica.removeAttribute('hidden');
          }, 2500);
        });
      }

      // Android: market:// vale a pena porque leva direto ao app da Play Store.
      if (isAndroid && embutido && android) {
        var webA = android.getAttribute('href');
        android.addEventListener('click', function () {
          setTimeout(function () {
            if (!document.hidden && dica) dica.removeAttribute('hidden');
          }, 2500);
        });
        void webA;
      }
    })();
  </script>
</body>
</html>
